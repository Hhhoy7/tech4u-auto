name: daily-video
on:
  schedule:
    - cron: "0 9 * * *"     # يومياً 09:00 UTC (12:00 بتوقيت مكة)؛ الرفع يستغرق وقتاً ثم يُجدوِل النشر
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt && bash scripts/get_fonts.sh
      - name: Produce and upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/main.py
      - name: Save state
        run: |
          git config user.name "tech4u-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/published.json topics.json
          git diff --cached --quiet || (git commit -m "state: published video" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: video, path: "output/*/video.mp4\noutput/*/script.json\noutput/*/thumbnail.jpg", retention-days: 7 }
