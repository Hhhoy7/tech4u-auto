name: daily-video
on:
  schedule:
    - cron: "0 9 * * *"     # يومياً 09:00 UTC (12:00 بتوقيت مكة)؛ الرفع يستغرق وقتاً ثم يُجدوِل النشر
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt && bash scripts/get_fonts.sh
      - name: Load keys
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # كل المفاتيح في سر واحد: أسطر بصيغة NAME=value (تقبل مسافات وCRLF)
          printf '%s\n' "$ENV_FILE" | tr -d '\r' | while IFS= read -r line; do
            case "$line" in *=*) ;; *) continue;; esac
            name=$(printf '%s' "${line%%=*}" | tr -d ' \t')
            val=$(printf '%s' "${line#*=}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$name" ] || [ -z "$val" ] && continue
            echo "::add-mask::$val"
            echo "$name=$val" >> "$GITHUB_ENV"
          done
      - name: Produce and upload
        run: python src/main.py
      - name: Save state
        run: |
          git config user.name "tech4u-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/published.json topics.json
          git diff --cached --quiet || (git commit -m "state: published video" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: video, path: "output/*/video.mp4\noutput/*/script.json\noutput/*/thumbnail.jpg", retention-days: 7 }
