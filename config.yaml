channel:
  name: TECH4U
  language: ar            # لغة الفيديو
  category_id: "28"       # Science & Technology
  tagline: "تقنية تهمك"

video:
  target_minutes: 8       # مدة الفيديو التقريبية
  width: 1920
  height: 1080
  fps: 30

voice:
  # provider: local = صوت محلي مجاني (يُعتمد بعد اختبار سماعي). elevenlabs محفوظ كخيار مستقبلي فقط
  # (خطتك المجانية لا تسمح بالاستخدام التجاري ولا بأصوات المكتبة عبر API).
  provider: recorded   # recorded = تسجيلك أنت (الافتراضي الآن) | local = SILMA المستنسَخ (فشل عندك) | elevenlabs = مستقبلي
  local:
    engine: silma          # SILMA TTS (Apache-2.0)؛ يُفعَّل في مرحلة تنفيذ TTS
    ref_audio: assets/voice_ref/ref.wav       # تسجيلك الشخصي، مستثنى من git ولا يُرفع لأي خدمة
    ref_text_file: assets/voice_ref/ref.txt
    force_tashkeel: false   # اختيار المالك بعد المقارنة (الإعداد D): بلا تشكيل آلي
    nfe_step: 32            # جودة أعلى وضعف الزمن؛ يُقاس زمنها على GTX 1650
    seed: 1
    align: {model: small, device: cpu, compute_type: int8}   # Whisper على CPU (أضمن على ويندوز)
    status: provisional     # مقبول مؤقتاً ("ممكن")؛ يُعاد التقييم بعد الفيديو التجريبي
  voice_id: "7N1xLmvR6jQolMXWRhvT"   # Arafat Almnshid (عراقي، ElevenLabs)
  model_id: eleven_multilingual_v2
  stability: 0.5
  similarity_boost: 0.8
  style: 0.25

llm:
  model: claude-sonnet-5-5

# حارس رصيد Claude (الرصيد الكلي 5$). لا يعمل أي استدعاء قبل: تثبيت الأسعار الرسمية + تفعيلك أنت.
budget:
  total_usd: 5.00
  hard_cap_usd: 4.00       # سقف صلب؛ يبقى 1$ احتياطاً
  warn_usd: 3.00
  tokens_per_char_upper: 0.7   # تقدير محلي متحفظ للعربية (بلا اتصال شبكة)
  pricing_verified: false      # اجعلها true بعد نسخ الأسعار من الصفحة الرسمية
  pricing:                     # دولار لكل مليون توكن
    claude-sonnet-5-5: {input: null, output: null}

visuals:
  provider: auto          # Pexels إن وُجد مفتاحه، وإلا Pixabay، وإلا بطاقات مولّدة
  music_file: ""          # اختياري: مسار موسيقى خلفية (مرخّصة) مثل assets/music.mp3
  music_volume: 0.08

publish:
  # private  = يُرفع خاصاً لتراجعه أنت (موصى به في البداية)
  # public   = ينشر فوراً
  # scheduled = يُرفع مجدولاً على publish_hour_utc
  privacy: private
  publish_hour_utc: 15    # 15:00 UTC = 18:00 مكة/الرياض
  contains_synthetic_media: true   # إفصاح يوتيوب عن المحتوى المُنتَج بالذكاء الاصطناعي
  default_tags: ["الذكاء الاصطناعي", "AI", "التقنية", "TECH4U"]

recorder:
  port: 8765             # صفحة التسجيل المحلية http://127.0.0.1:8765
